name: ci

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

# NOTE: there is deliberately no `npm run build` step yet. The build reads the
# product catalog from the live database (Supabase today), so it cannot pass with
# placeholder values and CI must not hold real secrets. Amplify's own build on
# `staging` is the build gate until the DynamoDB workstream lands; add the build
# here once it can run without a live database.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Rulesets cannot restrict a PR's source branch, so enforce it here.
      - name: Only staging or hotfix/* may target main
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            staging|hotfix/*) ;;
            *) echo "PRs into main must come from staging or hotfix/*"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      # PageProps/LayoutProps are generated by Next, not committed; without this
      # step the typecheck fails on a clean checkout.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
